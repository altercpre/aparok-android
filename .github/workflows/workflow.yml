name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup middleware dependency
        run: |
          chmod +x ./scripts/setup-middleware.sh
          ./scripts/setup-middleware.sh

      - name: Process Merged Release Manifest
        run: ./gradlew :app:processReleaseMainManifest --no-daemon

      - name: Verify zero-telemetry and merged manifest permissions
        run: |
          chmod +x scripts/verify-offline.sh
          bash scripts/verify-offline.sh

      - name: Verify sovereign offline matrix
        run: |
          chmod +x scripts/verify-sovereign-offline.sh
          bash scripts/verify-sovereign-offline.sh

      - name: Compile Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Run Sovereign Unit Tests
        run: |
          ./gradlew :domain:test --tests "io.aparok.app.domain.multiplayer.DefaultUserPermissionProviderTest" --no-daemon
          ./gradlew :app:testDebugUnitTest --tests "io.aparok.app.offline.SovereignOfflineMatrixTest" --tests "io.aparok.app.security.AparokEncryptionManagerTest" --tests "io.aparok.app.storage.AparokStorageManagerTest" --tests "io.aparok.app.backup.AparokBackupManagerTest" --no-daemon
