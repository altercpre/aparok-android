name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup middleware dependency
        run: |
          chmod +x ./middleware2.sh
          ./middleware2.sh

      - name: Verify zero-telemetry
        run: |
          chmod +x scripts/verify-offline.sh
          bash scripts/verify-offline.sh

      - name: Compile Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin --no-daemon
