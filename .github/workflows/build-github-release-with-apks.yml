name: Build, Sign, Verify and Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag for the release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: Build, Sign, Verify & Release APKs
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and Android Build Tools
        run: |
          SDKMANAGER=$(which sdkmanager 2>/dev/null || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;34.0.0" "ndk;28.1.13356709" "cmake;3.22.1" > /dev/null 2>&1

      - name: Build, Sign and Verify Release APKs
        run: |
          chmod +x scripts/release/build-sign-verify-release.sh
          TAG_VAL="${{ github.event.inputs.tag_name || github.ref_name }}"
          TITLE_VAL="${{ github.event.inputs.release_name || '' }}"
          bash scripts/release/build-sign-verify-release.sh "$TAG_VAL" "$TITLE_VAL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Upload Release Artefacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || format('Aparok Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          files: build/release-artefacts/*
          generate_release_notes: false
          body: |
            ### Aparok Android ${{ github.event.inputs.tag_name || github.ref_name }}
            Official sovereign release of Aparok for Android.

            - **Zero-Telemetry**: No tracking, analytics, or third-party monitoring.
            - **Sovereign Storage**: Fully local-first data architecture.
            - **Local-First**: Complete functionality offline and on local networks.
            - **Permissionless**: Unlocked lifetime access, no paywalls or memberships.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
