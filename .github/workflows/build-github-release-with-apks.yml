name: Build, Sign, Verify and Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag for the release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title (optional)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: Build, Sign, Verify & Release APKs
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" "ndk;28.1.13356709" "cmake;3.22.1" > /dev/null 2>&1

      - name: Build, Sign and Verify Release APKs
        run: |
          chmod +x scripts/release/build-sign-verify-release.sh
          TAG_VAL="${{ github.event.inputs.tag_name || github.ref_name }}"
          TITLE_VAL="${{ github.event.inputs.release_name || '' }}"
          bash scripts/release/build-sign-verify-release.sh "$TAG_VAL" "$TITLE_VAL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artefacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || format('Aparok Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          files: build/release-artefacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
