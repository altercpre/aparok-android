name: Generate Keystore Once
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          keytool -genkeypair -v -keystore app-release.jks -alias aparok -keyalg RSA -keysize 4096 -validity 10000 -storepass aparok123456 -keypass aparok123456 -dname "CN=Aparok"
          echo "=== SHA256 ==="
          keytool -list -v -keystore app-release.jks -alias aparok -storepass aparok123456 | grep "SHA256:"
          echo "=== BASE64_START ==="
          base64 -w 0 app-release.jks
          echo ""
          echo "=== BASE64_END ==="
