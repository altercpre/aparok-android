name: Generate Keystore Direct
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate and Pin Keystore
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p scripts/release release
          keytool -genkeypair -v \
            -keystore scripts/release/app-release.jks \
            -alias aparok \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass aparok123456 \
            -keypass aparok123456 \
            -dname "CN=Aparok" \
            -storetype JKS
          
          FP=$(keytool -list -v -keystore scripts/release/app-release.jks -alias aparok -storepass aparok123456 | grep "SHA256:" | head -n 1 | awk '{print $NF}')
          echo "Fingerprint: $FP"
          echo "$FP" > release/CERT_SHA256
          
          keytool -keypasswd -keystore scripts/release/app-release.jks -alias aparok -storepass aparok123456 -keypass aparok123456 -new aparok123456
          echo "Key verified successfully!"
          
          base64 -w 0 scripts/release/app-release.jks | gh secret set RELEASE_KEYSTORE_BASE64
          echo "RELEASE_KEYSTORE_BASE64 secret updated!"
          
          git config user.name "Aparok Bot"
          git config user.email "bot@aparok.io"
          git add release/CERT_SHA256
          git commit -m "chore: pin neutral release certificate SHA256" || true
          git push origin main
