pluginManagement {

    repositories {
        mavenLocal()
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    plugins {
        id 'androidx.navigation.safeargs.kotlin' version '2.9.6'
    }
}

dependencyResolutionManagement {
    def githubProperties = new Properties()
    def githubPropertiesFile = file("$rootDir${File.separator}github.properties")
    if (githubPropertiesFile.exists()) {
        githubProperties.load(new FileInputStream(githubPropertiesFile))
    }

    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/altercpre/aparok-core")
            credentials {
                username = githubProperties['gpr.usr'] ?: ""
                password = githubProperties['gpr.key'] ?: ""
            }
        }
    }
}

include ':app',
        ':core-utils',
        ':middleware',
        ':persistence',
        ':domain',
        ':data',
        ':device',
        ':presentation',
        ':core-ui',
        ':library-page-icon-picker-widget',
        ':library-emojifier',
        ':clipboard',
        ':protocol',
        ':core-models',
        ':test:android-utils',
        ':test:utils',
        ':test:core-models-stub',
        ':libs'

include ':feature-ui-settings'
include ':localization'
include ':feature-chats'
include ':feature-discussions'
include ':feature-all-content'
include ':feature-date'
include ':feature-object-type'
include ':feature-properties'
include ':feature-vault'
include ':feature-create-object'
include ':feature-os-widgets'
include ':feature-search'
